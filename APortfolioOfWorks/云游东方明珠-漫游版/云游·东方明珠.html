<!DOCTYPE html>

<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#e8cfae; height:100%;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  canvas { display:block; }

  #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #title { position:absolute; top:26px; left:30px; color:#4a3826; transition:color .6s; }
  #title h1 { margin:0; font-size:21px; font-weight:600; letter-spacing:0.4em; text-indent:0.4em; }
  #title p  { margin:6px 0 0; font-size:11px; letter-spacing:0.24em; opacity:0.66; font-weight:500; }
  body.night #title { color:#dbe5f5; }

  #hint { position:absolute; bottom:24px; left:30px; font-size:12px; letter-spacing:0.08em;
    color:#5a4632; opacity:0.78; line-height:1.9; transition:color .6s; max-width:46vw; }
  body.night #hint { color:#a9bad2; }
  #hint b { font-weight:600; color:#b06a3c; }
  body.night #hint b { color:#e8b86a; }

  #ctrl { position:absolute; top:24px; right:28px; display:flex; gap:10px; }
  #ctrl button { pointer-events:auto; cursor:pointer; border-radius:999px; padding:8px 16px;
    font-size:12px; letter-spacing:0.1em; font-weight:500; color:#4a3a28;
    background:rgba(255,250,240,0.75); border:1px solid rgba(255,255,255,0.7);
    backdrop-filter:blur(12px) saturate(1.3); -webkit-backdrop-filter:blur(12px) saturate(1.3);
    box-shadow:0 4px 14px rgba(80,60,40,0.16); transition:all .5s ease; }
  #ctrl button:hover { transform:translateY(-1px); }
  body.night #ctrl button { background:rgba(22,30,48,0.72); color:#d5e2f4; border-color:rgba(140,170,220,0.25); }

  #chips { position:absolute; bottom:60px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:94vw; }
  .chip { pointer-events:auto; cursor:pointer; border-radius:999px; padding:7px 14px;
    font-size:12px; letter-spacing:0.05em; color:#4a3a28;
    background:rgba(255,250,240,0.7); border:1px solid rgba(255,255,255,0.65);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 3px 10px rgba(80,60,40,0.14); transition:all .45s ease; }
  .chip:hover { transform:translateY(-2px); }
  .chip.sel { background:#c65f43; color:#fff8ef; }
  body.night .chip { background:rgba(22,30,48,0.7); color:#c8d7ec; border-color:rgba(140,170,220,0.22); }
  body.night .chip.sel { background:#d4548c; color:#fff; }

  #card { position:absolute; left:50%; bottom:112px; transform:translate(-50%, 24px);
    opacity:0; pointer-events:none;
    transition: transform .5s cubic-bezier(0.22,1,0.36,1), opacity .4s ease, background .6s ease;
    background:rgba(255,250,240,0.92); backdrop-filter:blur(16px) saturate(1.3);
    -webkit-backdrop-filter:blur(16px) saturate(1.3);
    border:1px solid rgba(255,255,255,0.7); border-radius:16px;
    padding:15px 44px 13px 22px; max-width:min(420px, 84vw);
    box-shadow: 0 14px 40px rgba(80,60,40,0.2); }
  #card.show { transform:translate(-50%, 0); opacity:1; pointer-events:auto; }
  #card h2 { margin:0 0 2px; font-size:15px; color:#3a2e20; letter-spacing:0.12em; }
  #cardMeta { margin:0 0 7px; font-size:11px; color:#96703e; letter-spacing:0.06em; }
  #cardDesc { margin:0 0 8px; font-size:12.5px; line-height:1.75; color:#5c4c3a; }
  #cardTips { margin:0; font-size:11.5px; line-height:1.7; color:#8a7a64;

  #cardTips b { color:#b06a3c; font-weight:600; }
  body.night #card { background:rgba(20,28,46,0.9); border-color:rgba(140,170,220,0.22); }
  body.night #card h2 { color:#e3ecfa; }
  body.night #cardMeta { color:#c8a879; }
  body.night #cardDesc { color:#b9c8dd; }
  body.night #cardTips { color:#8496af; border-top-color:rgba(140,160,200,0.25); }
  #cardClose { position:absolute; top:8px; right:10px; border:none; background:none;
    font-size:17px; color:#8a97a8; cursor:pointer; padding:4px 6px; line-height:1; }

  #fade { position:fixed; inset:0; background:#08090f; opacity:0; pointer-events:none;
    transition:opacity .32s ease; z-index:20; }
  #dbg { position:absolute; top:70px; right:28px; font:11px/1.6 ui-monospace, Menlo, monospace;
    color:#5a4632; opacity:0.8; text-align:right; white-space:pre; display:none; }
  body.night #dbg { color:#a9bad2; }
  #err { position:absolute; top:26px; left:50%; transform:translateX(-50%); max-width:80vw;
    font:11px/1.5 ui-monospace, Menlo, monospace; color:#fff; background:rgba(180,40,40,0.85);
    padding:4px 10px; border-radius:6px; display:none; white-space:pre-wrap; }

  #jumpBtn { position:fixed; right:26px; bottom:118px; width:64px; height:64px; border-radius:50%;
    display:none; align-items:center; justify-content:center; z-index:15;
    font-size:15px; font-weight:600; color:#4a3a28; letter-spacing:0.05em;
    background:rgba(255,250,240,0.75); border:1px solid rgba(255,255,255,0.7);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 4px 14px rgba(80,60,40,0.2); }
  body.night #jumpBtn { background:rgba(22,30,48,0.72); color:#d5e2f4; border-color:rgba(140,170,220,0.25); }

  #stickBase { position:fixed; width:96px; height:96px; border-radius:50%; display:none;
    border:2px solid rgba(255,255,255,0.5); background:rgba(255,255,255,0.12); z-index:15;
    transform:translate(-50%,-50%); pointer-events:none; }
  #stickKnob { position:absolute; width:40px; height:40px; border-radius:50%; left:50%; top:50%;
    transform:translate(-50%,-50%); background:rgba(255,255,255,0.55); }

  @media (max-width:900px) { #card { bottom:158px; } #hint{ max-width:80vw; font-size:11px; } }
  @media (max-width:600px) {
    #title { top:18px; left:16px; max-width:calc(100vw - 132px); }
    #title h1 { font-size:16px; letter-spacing:0.16em; text-indent:0; }
    #title p { margin-top:4px; font-size:8px; letter-spacing:0.08em; line-height:1.5; }
    #ctrl { top:16px; right:14px; }
    #ctrl button { padding:7px 12px; font-size:11px; }
    #hint { display:none; }
    #chips {
      left:16px;
      right:96px;
      bottom:16px;
      transform:none;
      max-width:none;
      justify-content:flex-start;
      gap:6px;
    }
    .chip { padding:6px 10px; font-size:11px; }
    #card { bottom:138px; padding:14px 38px 12px 18px; }
  }
</style>

  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="ui">
  <div id="title"><h1>云游 · 东方明珠</h1><p>SHANGHAI · ORIENTAL PEARL — 走进陆家嘴</p></div>
  <div id="hint"></div>
  <div id="ctrl"><button id="nightBtn">🌙 看夜景</button></div>
  <div id="chips"></div>
  <div id="card"><button id="cardClose">×</button>
    <h2 id="cardName"></h2><p id="cardMeta"></p><p id="cardDesc"></p><p id="cardTips"></p>
  </div>

  <div id="err"></div>
</div>
<div id="fade"></div>
<div id="stickBase"><div id="stickKnob"></div></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

/* ================= 0 · 配置 / 钩子 / 防御 ================= */
const Q = new URLSearchParams(location.search);
const DEBUG = Q.has('debug');
const NOFX = Q.has('nofx');
const SHOT = Q.has('shot');
const FREEZE = parseInt(Q.get('freeze') || '0', 10);
if (SHOT) { const s = document.createElement('style'); s.textContent = '*{transition:none!important}'; document.head.appendChild(s); }

window.__err = [];
const errBox = document.getElementById('err');
function pushErr(m) { window.__err.push(String(m)); errBox.style.display = 'block'; errBox.textContent = window.__err.slice(0, 3).join('\n'); }
addEventListener('error', (e) => pushErr(e.message));
addEventListener('unhandledrejection', (e) => pushErr(e.reason?.message || e.reason));

const isCoarse = matchMedia('(pointer:coarse)').matches;
let DPR = Math.min(devicePixelRatio || 1, 2);
function mulberry32(a) { return function() { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(20260717);
const rnd = (a, b) => a + rng() * (b - a);
function mat(c, o = {}) { return new THREE.MeshStandardMaterial({ color: c, roughness: 0.88, metalness: 0, ...o }); }

/* 跨段共享注册表 */
const colliders = [];                       // 室外碰撞体
const CC = (x, z, r) => colliders.push({ t: 'c', x, z, r });
const CB = (x0, x1, z0, z1) => colliders.push({ t: 'b', x0, x1, z0, z1 });
const cityEmis = [];                        // 夜晚点亮的窗户材质
const ledMats = [];                         // 东方明珠 LED 材质
const portals = [];                         // 传送光环
const EXT = {};                             // 各 POI 的外观 group
const INT = {};                             // 各 POI 的室内定义

/* ================= 1 · 渲染器 / 场景 / 相机 ================= */
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' }); }
catch (e) { document.body.innerHTML = '<div style="padding:40vh 20px 0;text-align:center;color:#4a3826">这台设备暂时打不开 3D 世界（WebGL 不可用）。</div>'; throw e; }
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.info.autoReset = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#eccfae', 90, 380);
const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 1500);
camera.position.set(-6, 6, -6);

/* ================= 2 · 天穹 / 光照 / 主题 ================= */
const skyU = {
  uNight: { value: 0 }, uTime: { value: 0 },
  uDayTop: { value: new THREE.Color('#69a8dd') }, uDayHor: { value: new THREE.Color('#ffd9ac') },
  uNightTop: { value: new THREE.Color('#0a1128') }, uNightHor: { value: new THREE.Color('#3d3054') },
  uGlow: { value: new THREE.Color('#e07a3f') },
};
{
  const sky = new THREE.Mesh(new THREE.SphereGeometry(620, 32, 20), new THREE.ShaderMaterial({
    uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
      uniform float uNight, uTime;
      uniform vec3 uDayTop, uDayHor, uNightTop, uNightHor, uGlow;
      varying vec3 vDir;
      float h3(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719)))*43758.5453); }
      void main(){
        vec3 d = normalize(vDir);
        float h = pow(max(d.y, 0.0), 0.5);
        vec3 day = mix(uDayHor, uDayTop, h);
        float hb = pow(abs(d.y), 0.5);
        vec3 night = mix(uNightHor, uNightTop, max(h, hb*0.85));
        night += uGlow * 0.45 * exp(-abs(d.y) * 6.0);
        float sunAmt = pow(max(dot(d, normalize(vec3(-0.8, 0.28, 0.25))), 0.0), 5.0);
        day += vec3(1.1, 0.55, 0.25) * sunAmt * 0.55;
        vec3 col = mix(day, night, uNight);
        vec3 cell = floor(d * 130.0);
        float hs = h3(cell);
        vec3 f = fract(d * 130.0) - 0.5;
        float star = smoothstep(0.16, 0.0, length(f)) * step(0.992, hs);
        star *= 0.55 + 0.45 * sin(uTime * 1.8 + hs * 40.0);
        col += vec3(0.9, 0.95, 1.0) * star * uNight * smoothstep(0.08, 0.4, d.y);
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  }));
  scene.add(sky);
}
const hemi = new THREE.HemisphereLight('#cfd9ec', '#d9b58a', 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffce93', 2.6);
sun.position.set(-65, 44, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left = -100; sc.right = 100; sc.top = 100; sc.bottom = -100; sc.near = 5; sc.far = 280;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.15;
scene.add(sun);
const fill = new THREE.DirectionalLight('#8fa8d8', 0.45);
fill.position.set(60, 40, -30);
scene.add(fill);

const TH = {
  sunD: new THREE.Color('#ffce93'), sunN: new THREE.Color('#7d9fd6'),
  hemiSD: new THREE.Color('#cfd9ec'), hemiSN: new THREE.Color('#3a4f78'),
  hemiGD: new THREE.Color('#d9b58a'), hemiGN: new THREE.Color('#2c3550'),
  fogD: new THREE.Color('#eccfae'), fogN: new THREE.Color('#10182e'),
  deepD: new THREE.Color('#3a6f78'), deepN: new THREE.Color('#101b33'),
  shalD: new THREE.Color('#82c2c4'), shalN: new THREE.Color('#2c3f66'),
};

/* ================= 3 · 程序纹理 ================= */
function facadeTex(cols, rows, lit, baseCss, winCss) {
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 256;
  const c = cv.getContext('2d');
  c.fillStyle = baseCss; c.fillRect(0, 0, 128, 256);
  const cw = 128 / cols, ch = 256 / rows;
  const em = document.createElement('canvas'); em.width = 128; em.height = 256;
  const e = em.getContext('2d'); e.fillStyle = '#000'; e.fillRect(0, 0, 128, 256);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    c.fillStyle = winCss;
    c.fillRect(x * cw + cw * 0.14, y * ch + ch * 0.16, cw * 0.72, ch * 0.62);
    if (rng() < lit) { e.fillStyle = rng() < 0.75 ? '#ffd28a' : '#bfe0ff'; e.fillRect(x * cw + cw * 0.14, y * ch + ch * 0.16, cw * 0.72, ch * 0.62); }
  }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  const te = new THREE.CanvasTexture(em); te.colorSpace = THREE.SRGBColorSpace;
  te.wrapS = te.wrapT = THREE.RepeatWrapping;
  return { map: t, em: te };
}
function cityMat(cols, rows, lit, baseCss, winCss, o = {}) {
  const { map, em } = facadeTex(cols, rows, lit, baseCss, winCss);
  const m = new THREE.MeshStandardMaterial({ map, emissive: '#ffffff', emissiveMap: em, emissiveIntensity: 0.12, roughness: 0.8, metalness: 0.05, ...o });
  cityEmis.push(m);
  return m;
}
function ringPaveTex() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 512;
  const c = cv.getContext('2d');
  c.fillStyle = '#cdc3ae'; c.fillRect(0, 0, 512, 512);
  c.strokeStyle = 'rgba(120,105,80,0.4)'; c.lineWidth = 2;
  for (let r = 20; r < 380; r += 24) { c.beginPath(); c.arc(256, 256, r, 0, 6.29); c.stroke(); }
  for (let a = 0; a < 24; a++) { c.beginPath(); c.moveTo(256, 256); c.lineTo(256 + Math.cos(a / 24 * 6.28) * 380, 256 + Math.sin(a / 24 * 6.28) * 380); c.stroke(); }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function roadTex() {
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 256;
  const c = cv.getContext('2d');
  c.fillStyle = '#4b5058'; c.fillRect(0, 0, 64, 256);
  c.fillStyle = 'rgba(235,225,190,0.85)';
  for (let y = 0; y < 256; y += 64) c.fillRect(29, y + 8, 6, 34);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function sphereGridTex(baseCss) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const c = cv.getContext('2d');
  c.fillStyle = baseCss; c.fillRect(0, 0, 512, 256);
  c.strokeStyle = 'rgba(70,12,44,0.3)'; c.lineWidth = 1.5;
  for (let x = 0; x <= 512; x += 21) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 256); c.stroke(); }
  for (let y = 0; y <= 256; y += 21) { c.beginPath(); c.moveTo(0, y); c.lineTo(512, y); c.stroke(); }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function plankTex(base, gap) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
  const c = cv.getContext('2d');
  c.fillStyle = base; c.fillRect(0, 0, 256, 256);
  c.strokeStyle = gap; c.lineWidth = 3;
  for (let x = 0; x <= 256; x += 32) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 256); c.stroke(); }
  c.strokeStyle = 'rgba(0,0,0,0.08)'; c.lineWidth = 1;
  for (let i = 0; i < 40; i++) { const x = rng() * 256, y = rng() * 256; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + rnd(10, 40)); c.stroke(); }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function carpetTex(base, accent) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 512;
  const c = cv.getContext('2d');
  c.fillStyle = base; c.fillRect(0, 0, 512, 512);
  c.strokeStyle = accent; c.lineWidth = 3;
  for (let r = 24; r < 260; r += 28) { c.beginPath(); c.arc(256, 256, r, 0, 6.29); c.stroke(); }
  c.lineWidth = 1; c.strokeStyle = accent;
  for (let a = 0; a < 36; a++) { c.beginPath(); c.moveTo(256 + Math.cos(a / 36 * 6.28) * 40, 256 + Math.sin(a / 36 * 6.28) * 40); c.lineTo(256 + Math.cos(a / 36 * 6.28) * 250, 256 + Math.sin(a / 36 * 6.28) * 250); c.stroke(); }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function makeLabel(text, w = 5.6) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 112;
  const c = cv.getContext('2d');
  c.fillStyle = 'rgba(16,22,36,0.78)';
  c.beginPath(); c.roundRect(6, 6, 500, 100, 26); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 3; c.stroke();
  c.fillStyle = '#f5ede0'; c.font = '600 44px "PingFang SC", sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, 256, 58);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  sp.scale.set(w, w * 0.22, 1);
  return sp;
}

const world = new THREE.Group();
scene.add(world);
/* —— 第 1 段结束 —— */

/* ================= 4 · 地面 / 黄浦江 / 街景 ================= */
{
  const plate = new THREE.Mesh(new THREE.BoxGeometry(150, 2.4, 150), mat('#c9bfa9'));
  plate.position.set(20, -1.2, 0); plate.receiveShadow = true;
  const far = new THREE.Mesh(new THREE.BoxGeometry(28, 2.4, 150), mat('#c2b7a1'));
  far.position.set(-109, -1.2, 0); far.receiveShadow = true;
  world.add(plate, far);
  // 防汛墙压顶石
  const cap = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.25, 150), mat('#b7ab93'));
  cap.position.set(-54.8, 0.12, 0); world.add(cap);
}
// 黄浦江
const waterU = {
  uTime: { value: 0 }, uNight: { value: 0 },
  uDeep: { value: TH.deepD.clone() }, uShallow: { value: TH.shalD.clone() },
  uTowerXZ: { value: new THREE.Vector2(-25, 25) },
};
{
  const water = new THREE.Mesh(new THREE.PlaneGeometry(40, 150, 1, 1), new THREE.ShaderMaterial({
    uniforms: waterU, fog: false,
    vertexShader: `varying vec3 vW; void main(){ vW=(modelMatrix*vec4(position,1.0)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
      uniform float uTime, uNight; uniform vec3 uDeep, uShallow; uniform vec2 uTowerXZ;
      varying vec3 vW;

/* ================= 5 · 建筑工具 ================= */
function strut(ax, ay, az, bx, by, bz, r0, r1, m) {
  const a = new THREE.Vector3(ax, ay, az), b = new THREE.Vector3(bx, by, bz);
  const d = b.clone().sub(a), len = d.length();
  const g = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, len, 12), m);
  g.position.copy(a).addScaledVector(d, 0.5);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return g;
}
function hRing(r, tube, y, m, seg = 64) {
  const t = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 10, seg), m);
  t.rotation.x = Math.PI / 2; t.position.y = y;
  return t;
}
function twistGeo(H, rB, rT, twist) {
  const radial = 96, hSeg = 64, pos = [], uv = [], idx = [];
  for (let j = 0; j <= hSeg; j++) {
    const t = j / hSeg, y = t * H, R = rB + (rT - rB) * t, rot = twist * t;
    for (let i = 0; i <= radial; i++) {
      const th = i / radial * Math.PI * 2;
      const prof = 0.82 + 0.18 * Math.cos(3 * th);
      const a = th + rot, r = R * prof;
      pos.push(Math.cos(a) * r, y, Math.sin(a) * r);
      uv.push(i / radial * 4, t * 3.5);
    }
  }
  for (let j = 0; j < hSeg; j++) for (let i = 0; i < radial; i++) {
    const a = j * (radial + 1) + i, b = a + radial + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

    player.pos.set(p.view[0], 0, p.view[1]);
    const ang = p.door ? Math.atan2(p.door[0] - p.view[0], p.door[1] - p.view[1]) : -Math.PI / 2;
    player.yaw = ang; camYaw = ang + Math.PI; camPitch = 0.3; camDist = 10;
    showCard(id, false); setChip(id); setHint();
  };
  if (instant) { doIt(); snapCam = true; portalCool = performance.now() + 1200; }
  else transition(doIt);
}

/* ================= 19 · UI ================= */
function showCard(id, inner) {
  const p = POI_BY[id];
  document.getElementById('cardName').textContent = p.name;
  document.getElementById('cardMeta').textContent = inner && p.inner ? `${p.meta} — 现在位于「${p.inner}」` : p.meta;
  document.getElementById('cardDesc').textContent = p.desc;
  document.getElementById('cardTips').innerHTML = p.tips;
  cardEl.classList.add('show');
}
function hideCard() { cardEl.classList.remove('show'); }
document.getElementById('cardClose').onclick = hideCard;
const chipEls = {};
{
  const chipsEl = document.getElementById('chips');
  POIS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = p.chip;
    b.onclick = () => gotoPOI(p.id);
    chipsEl.appendChild(b); chipEls[p.id] = b;
  });
}
function setChip(id) { POIS.forEach(p => chipEls[p.id].classList.toggle('sel', p.id === id)); }
function setHint() {
  const h = document.getElementById('hint');
  if (mode.in) {
    const p = POI_BY[mode.in];
    h.innerHTML = `<b>${p.chip} · ${p.inner}</b><br>走进金色光环${mode.in === 'cruise' ? '下船' : '返回地面'} · 或按 Esc 离开`;
  } else {
    h.innerHTML = isCoarse
      ? '左半屏拖动 = 走动 · 右半屏拖动 = 转视角 · 右下按钮跳<br>走进发光光环，进入建筑'
      : '<b>W A S D</b> / 方向键 走动 · <b>Shift</b> 跑 · <b>Space</b> 跳<br>鼠标拖动转视角 · 滚轮拉近拉远<br>走进发光光环进入建筑 · <b>Esc</b> 返回';
  }
}
setHint();
const nightBtn = document.getElementById('nightBtn');
let nightTarget = 0, nt = 0;
function setNight(on) {
  nightTarget = on ? 1 : 0;
  document.body.classList.toggle('night', on);
  nightBtn.textContent = on ? '☀️ 看日景' : '🌙 看夜景';
}
nightBtn.onclick = () => setNight(nightTarget < 0.5);

/* ================= 20 · 移动 / 碰撞 ================= */
player.vx = 0; player.vz = 0; player.airY = 0; player.vy = 0;
function doJump() {
  if (!fading && player.airY <= 0.001) { player.vy = 7.6; player.airY = 0.001; }
}
if (isCoarse) {
  const jb = document.getElementById('jumpBtn');
  jb.style.display = 'flex';
  jb.addEventListener('pointerdown', e => { e.preventDefault(); doJump(); });
}
function moveUpdate(dt) {
  // 跳跃：竖直方向重力积分
  if (player.airY > 0 || player.vy !== 0) {
    player.vy -= 22 * dt;
    player.airY += player.vy * dt;
    if (player.airY <= 0) { player.airY = 0; player.vy = 0; }
  }
  let ix = 0, iz = 0;
  if (keys.KeyW || keys.ArrowUp) iz += 1;
  if (keys.KeyS || keys.ArrowDown) iz -= 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (stick.active) { ix += stick.vx; iz -= stick.vy; }
  const run = keys.ShiftLeft || keys.ShiftRight;
  const L = Math.hypot(ix, iz);
  let tvx = 0, tvz = 0;
  if (L > 0.01 && !fading) {
    const k = Math.min(1, L);
    ix = ix / L * k; iz = iz / L * k;
    const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
    const wx = fx * iz - fz * ix, wz = fz * iz + fx * ix;
    const sp = run ? 8.5 : 4.3;
    tvx = wx * sp; tvz = wz * sp;
    const ang = Math.atan2(wx, wz);
    let d = ang - player.yaw;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    player.yaw += d * Math.min(1, dt * 12);
  }
  const sm = Math.min(1, dt * 10);
  player.vx += (tvx - player.vx) * sm;
  player.vz += (tvz - player.vz) * sm;
  player.pos.x += player.vx * dt;
  player.pos.z += player.vz * dt;
  player.spd = Math.hypot(player.vx, player.vz);

  if (!mode.in) {
    let px = player.pos.x, pz = player.pos.z; const r = 0.42;
    for (const c of colliders) {
      if (c.t === 'c') {
        const dx = px - c.x, dz = pz - c.z, d = Math.hypot(dx, dz), m = c.r + r;
        if (d < m && d > 1e-4) { px = c.x + dx / d * m; pz = c.z + dz / d * m; }
      } else {
        const cx = Math.max(c.x0, Math.min(px, c.x1)), cz = Math.max(c.z0, Math.min(pz, c.z1));
        if (cx === px && cz === pz) {
          const dl = px - c.x0, dr = c.x1 - px, dn = pz - c.z0, df = c.z1 - pz;
          const m = Math.min(dl, dr, dn, df);
          if (m === dl) px = c.x0 - r; else if (m === dr) px = c.x1 + r;
          else if (m === dn) pz = c.z0 - r; else pz = c.z1 + r;
        } else {
          const dx = px - cx, dz = pz - cz, d = Math.hypot(dx, dz);
          if (d < r && d > 1e-4) { px = cx + dx / d * r; pz = cz + dz / d * r; }
        }
      }
    }
    const inPier = pz > -22 && pz < -18 && px < -53.4;
    if (inPier) { px = Math.max(-63.6, px); pz = Math.max(-21.75, Math.min(-18.25, pz)); }
    else { px = Math.max(-53.5, Math.min(93.5, px)); pz = Math.max(-73.5, Math.min(73.5, pz)); }
    player.pos.set(px, player.airY, pz);
  } else {
    const it = INT[mode.in], c = it.clamp;
    if (c.kind === 'circle') {
      const dx = player.pos.x - c.x, dz = player.pos.z - c.z, d = Math.hypot(dx, dz);
      if (d > c.r) { player.pos.x = c.x + dx / d * c.r; player.pos.z = c.z + dz / d * c.r; }
      else if (c.core > 0 && d < c.core && d > 1e-4) { player.pos.x = c.x + dx / d * c.core; player.pos.z = c.z + dz / d * c.core; }
    } else {
      player.pos.x = Math.max(c.x0, Math.min(c.x1, player.pos.x));
      player.pos.z = Math.max(c.z0, Math.min(c.z1, player.pos.z));
    }
    if (it.obstacles) {
      let px = player.pos.x, pz = player.pos.z; const r = 0.42;
      for (const b of it.obstacles) {
        const cx = Math.max(b.x0, Math.min(px, b.x1)), cz = Math.max(b.z0, Math.min(pz, b.z1));
        if (cx === px && cz === pz) {
          const dl = px - b.x0, dr = b.x1 - px, dn = pz - b.z0, df = b.z1 - pz;
          const m = Math.min(dl, dr, dn, df);
          if (m === dl) px = b.x0 - r; else if (m === dr) px = b.x1 + r;
          else if (m === dn) pz = b.z0 - r; else pz = b.z1 + r;
        } else {
          const dx = px - cx, dz = pz - cz, d = Math.hypot(dx, dz);
          if (d < r && d > 1e-4) { px = cx + dx / d * r; pz = cz + dz / d * r; }
        }
      }
      player.pos.x = px; player.pos.z = pz;
    }
    player.pos.y = it.floorY + player.airY;
  }
  if (!fading && performance.now() > portalCool) {
    for (const p of portals) {
      if ((mode.in ? p.scope === mode.in : p.scope === 'out') &&
          Math.hypot(player.pos.x - p.x, player.pos.z - p.z) < p.trigR) { p.act(); break; }
    }
  }
}

/* ================= 21 · 后期 / 主循环 ================= */
let composer = null, bloomPass = null, fxaaPass = null;
if (!NOFX) {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.5, 0.82);
  composer.addPass(bloomPass);
  fxaaPass = new ShaderPass(FXAAShader);
  composer.addPass(fxaaPass);
  composer.addPass(new OutputPass());
}
function setFxaaRes() { if (fxaaPass) fxaaPass.material.uniforms.resolution.value.set(1 / (innerWidth * DPR), 1 / (innerHeight * DPR)); }
setFxaaRes();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
  setFxaaRes();
});
const dbgEl = document.getElementById('dbg');
if (DEBUG) dbgEl.style.display = 'block';
const CAM_TOP = { pearl: 3.1, sht: 4.3, jinmao: 8 };

let prevT = performance.now(), et = 0, frame = 0, walkPhase = 0;
function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - prevT) / 1000); prevT = now;
  et += dt; frame++;
  skyU.uTime.value = et; waterU.uTime.value = et;

  moveUpdate(dt);

  // 角色动画
  charG.position.copy(player.pos);
  charG.rotation.y = player.yaw;
  walkPhase += player.spd * dt * 2.4;
  const kk = Math.min(1, player.spd / 4.3);
  if (player.airY > 0.02) {
    legL.rotation.x = -0.5; legR.rotation.x = 0.62;
    armL.rotation.x = -1.0; armR.rotation.x = -1.0;
    armL.rotation.z = 0.5; armR.rotation.z = -0.5;
  } else {
    const sw = Math.sin(walkPhase) * 0.62 * kk;
    legL.rotation.x = sw; legR.rotation.x = -sw;
    armL.rotation.x = -sw * 0.8; armR.rotation.x = sw * 0.8;
    armL.rotation.z = 0.08 + kk * 0.05; armR.rotation.z = -0.08 - kk * 0.05;
  }
  const bob = Math.abs(Math.sin(walkPhase)) * 0.05 * kk;
  torsoG.position.y = 1.06 + bob + Math.sin(et * 2) * 0.008;
  torsoG.rotation.x = kk * (player.spd > 5.5 ? 0.2 : 0.1);
  headG.position.y = 1.56 + bob;

  // 相机
  const ty = player.pos.y + 1.5;
  const cp = Math.cos(camPitch), spp = Math.sin(camPitch);
  let cx = player.pos.x + Math.sin(camYaw) * cp * camDist;
  let cy = ty + spp * camDist;
  let cz = player.pos.z + Math.cos(camYaw) * cp * camDist;
  if (mode.in) {
    const it = INT[mode.in], c = it.clamp;
    if (c.kind === 'circle') {
      const dx = cx - c.x, dz = cz - c.z, d = Math.hypot(dx, dz), mx = c.r + 0.6;
      if (d > mx) { cx = c.x + dx / d * mx; cz = c.z + dz / d * mx; }
      const top = CAM_TOP[mode.in];
      cy = Math.max(it.floorY + 0.35, top ? Math.min(it.floorY + top, cy) : cy);
    } else {
      cy = Math.max(it.floorY + 0.4, cy);
    }
  } else { cy = Math.max(0.55, cy); }
  if (snapCam) { camera.position.set(cx, cy, cz); snapCam = false; }
  else {
    const f = 1 - Math.exp(-dt * 11);
    camera.position.x += (cx - camera.position.x) * f;
    camera.position.y += (cy - camera.position.y) * f;
    camera.position.z += (cz - camera.position.z) * f;
  }
  camera.lookAt(player.pos.x, ty, player.pos.z);

  // 车 / 船 / 云 / 光环
  cars.forEach(c => {
    let brake = false;
    if (c.axis === 'z') {
      if (Math.abs(player.pos.x - c.lane) < 2.2 && (player.pos.z - c.p) * c.dir > 0 && Math.abs(player.pos.z - c.p) < 5.5) brake = true;
      if (!brake) c.p += c.s * c.dir * dt;
      if (c.p > 74) c.p = -74; else if (c.p < -74) c.p = 74;
      c.g.position.set(c.lane, 0, c.p);
      c.g.rotation.y = c.dir > 0 ? 0 : Math.PI;
    } else {
      if (Math.abs(player.pos.z - c.lane) < 2.2 && (player.pos.x - c.p) * c.dir > 0 && Math.abs(player.pos.x - c.p) < 5.5) brake = true;
      if (!brake) c.p += c.s * c.dir * dt;
      if (c.p > 90) c.p = -40; else if (c.p < -40) c.p = 90;
      c.g.position.set(c.p, 0, c.lane);
      c.g.rotation.y = c.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
    }
  });
  boats.forEach(b => {
    b.g.position.z += b.s * b.dir * dt;
    if (b.g.position.z > 85) b.g.position.z = -85;
    else if (b.g.position.z < -85) b.g.position.z = 85;
    b.g.rotation.y = b.dir > 0 ? 0 : Math.PI;
    b.g.position.y = Math.sin(et * 0.8 + b.g.position.z * 0.05) * 0.06 - 0.05;
  });
  const ship = INT.cruise.g;
  ship.rotation.x = Math.sin(et * 0.6) * 0.006;
  ship.rotation.z = Math.sin(et * 0.83) * 0.005;
  ship.position.y = Math.sin(et * 0.7) * 0.04;
  clouds.forEach(c => { c.g.position.x += c.s * dt; if (c.g.position.x > 240) c.g.position.x = -240; });
  portals.forEach((p, i) => {
    const s = 1 + 0.06 * Math.sin(et * 2.4 + i);
    p.ring.scale.setScalar(s);
    p.discM.opacity = 0.13 + 0.09 * (0.5 + 0.5 * Math.sin(et * 2.4 + i));
  });

  // 昼夜
  nt += (nightTarget - nt) * Math.min(1, dt * 2);
  skyU.uNight.value = nt; waterU.uNight.value = nt;
  sun.color.lerpColors(TH.sunD, TH.sunN, nt); sun.intensity = 2.6 - nt * 2.0;
  hemi.color.lerpColors(TH.hemiSD, TH.hemiSN, nt);
  hemi.groundColor.lerpColors(TH.hemiGD, TH.hemiGN, nt);
  hemi.intensity = 0.75 - nt * 0.3;
  fill.intensity = 0.45 - nt * 0.2;
  scene.fog.color.lerpColors(TH.fogD, TH.fogN, nt);
  waterU.uDeep.value.lerpColors(TH.deepD, TH.deepN, nt);
  waterU.uShallow.value.lerpColors(TH.shalD, TH.shalN, nt);
  const ci = 0.12 + nt * 1.05;
  cityEmis.forEach(m => m.emissiveIntensity = ci);
  lampBulbMat.emissiveIntensity = 0.05 + nt * 2.6;
  carLightMat.emissiveIntensity = 0.1 + nt * 2.2;
  tailMat.emissiveIntensity = 0.15 + nt * 1.6;
  stringMat.emissiveIntensity = 0.15 + nt * 2.2;
  ledM.emissiveIntensity = nt * (1.05 + 0.35 * Math.sin(et * 1.3));
  ledM.emissive.setHSL(0.93 - 0.05 * (0.5 + 0.5 * Math.sin(et * 0.21)), 0.75, 0.5);
  beaconMat.emissiveIntensity = 0.5 + (0.5 + nt * 2.2) * (0.5 + 0.5 * Math.sin(et * 3.2));
  if (bloomPass) bloomPass.strength = 0.32 + nt * 0.36;

  if (composer) composer.render(); else renderer.render(scene, camera);
  if (DEBUG && frame % 10 === 0) {
    dbgEl.textContent = `pos ${player.pos.x.toFixed(1)}, ${player.pos.z.toFixed(1)}\nmode ${mode.in || 'out'}\nfps ${(1 / Math.max(dt, 1e-4)).toFixed(0)}  calls ${renderer.info.render.calls}`;
  }
  renderer.info.reset();
  if (!(FREEZE && frame >= FREEZE)) requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ================= 22 · 验证钩子 ================= */
window.__go = (id) => gotoPOI(id, true);
window.__enter = (id) => enterPOI(id, true);
window.__exit = () => exitPOI(true);
window.__night = (v) => setNight(!!v);
window.__state = () => ({
  x: +player.pos.x.toFixed(2), y: +player.pos.y.toFixed(2), z: +player.pos.z.toFixed(2),
  mode: mode.in || 'out', night: nightTarget, frame, errs: window.__err,
});
if (Q.get('night') != null) setNight(true);
if (Q.get('goto') && POI_BY[Q.get('goto')]) gotoPOI(Q.get('goto'), true);
if (Q.get('enter') && INT[Q.get('enter')]) enterPOI(Q.get('enter'), true);
</script>
